global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: almond
    metrics_path: /metrics
    static_configs:
      - targets: ["howru-api.howru-proxy.svc.cluster.local:80"]
