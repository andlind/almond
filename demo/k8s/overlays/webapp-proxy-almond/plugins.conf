# [service_name] description; plugin args; active; interval
[check_var_log] Check /var/log;check_disk -w 10% -c 5% -p /var/log;1;1 {"environment":"demo", "application":"wp_sidevar"}
[check_memory] Check memory usage;check_memory.py -w 15 -c 10;1;1 {"environment":"demo", "application":"wp_sidecar"}
[check_almond] Check Almond process;check_procs -C almond -c 1:5;1;1 {"environment":"demo", "application":"wp_sidecar"}
[check_uptime] Check uptime;check_uptime.sh 30 60;1;60 {"environment":"demo", "application":"wp_sidecar"}
[check_nginx_active] NGINX active connections;check_nginx_status.sh active 50 100;1;1 {"environment":"demo", "application":"webproxy"}
[check_nginx_reading] NGINX reading connections;check_nginx_status.sh reading 5 10;1;1 {"environment":"demo", "application":"webproxy"}
[check_nginx_writing] NGINX writing connections;check_nginx_status.sh writing 5 10;1;1 {"environment":"demo", "application":"webproxy"}
[check_nginx_waiting] NGINX waiting connections;check_nginx_status.sh waiting 20 50;1;1 {"environment":"demo", "application":"webproxy"}
[check_nginx_requests] NGINX total requests;check_nginx_status.sh requests;1;1 {"environment":"demo", "application":"webproxy"}
