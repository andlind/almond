# [service_name] description; plugin args;active;interval
[check_uptime] Check uptime;check_uptime.sh 30 60;1;60 {"environment":"demo", "application":"quickpizza_sc"}
[check_var_log] Check /var/log;check_disk -w 10% -c 5% -p /var/log;1;1 {"environment":"demo", "application:"quickpizza_sc"}
[check_memory] Check memory usage;check_memory.py -w 15 -c 10;1;1 {"environment":"demo", "application":"quickpizza_sc"}
[check_almond] Check Almond sidecar process;check_procs -C almond -c 1:5;1;1 {"environment":"demo", "application":"quickpizza_sc"}
[check_quickpizza] Quick Pizza metrics;check_exporter.py -H http://localhost:3333/metrics -c /etc/almond/check_exporter/config.yaml;1;1 {"environment":"demo", "application":"quickpizza"}
