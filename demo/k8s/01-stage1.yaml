apiVersion: v1
kind: Namespace
metadata:
  name: microservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redisdemo:local
          imagePullPolicy: Never
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: almond-data
              mountPath: /opt/almond/data
      volumes:
        - name: almond-data
          hostPath:
            path: /var/lib/almond-demo/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: microservice
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customapp
  namespace: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customapp
  template:
    metadata:
      labels:
        app: customapp
    spec:
      containers:
        - name: customapp
          image: custapplication:local
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: redis
          ports:
            - name: api
              containerPort: 8099
            - name: almond
              containerPort: 9909
          volumeMounts:
            - name: almond-data
              mountPath: /opt/almond/data
          # Add the Linux capabilities from the current docker run only
          # if the application needs them.
          securityContext:
            capabilities:
              add: ["SYS_TIME", "SYS_NICE", "SYS_PTRACE"]
      volumes:
        - name: almond-data
          hostPath:
            path: /var/lib/almond-demo/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: customapp
  namespace: microservice
spec:
  selector:
    app: customapp
  ports:
    - name: api
      port: 8099
      targetPort: 8099
    - name: almond
      port: 9909
      targetPort: 9909
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: webapp:local
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 80
          volumeMounts:
            - name: almond-data
              mountPath: /opt/almond/data
      volumes:
        - name: almond-data
          hostPath:
            path: /var/lib/almond-demo/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: microservice
spec:
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-10
  namespace: microservice
spec:
  type: ExternalName
  externalName: redpanda.redpanda.svc.cluster.local
