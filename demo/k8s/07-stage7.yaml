apiVersion: v1
kind: Namespace
metadata:
  name: quick-pizza
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickpizza
  namespace: quick-pizza
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quickpizza
  template:
    metadata:
      labels:
        app: quickpizza
    spec:
      containers:
        - name: quickpizza
          image: ghcr.io/grafana/quickpizza-local:latest
          ports:
            - name: http
              containerPort: 3333
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: almond-monitor
          image: quickpizza-almond:local
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: exporter-config
              mountPath: /etc/almond/check_exporter/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: exporter-config
          configMap:
            name: quickpizza-almond-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quickpizza-almond-config
  namespace: quick-pizza
data:
  config.yaml: |
    metrics:
      quickpizza_server_http_request_duration_seconds_gauge:
        - labels:
            method: "POST"
            path: "/api/pizza"
            status: "200"
          type: above
          thresholds:
            warning: 0.5
            critical: 2

      process_resident_memory_bytes:
        type: above
        thresholds:
          warning: 268435456
          critical: 536870912

      process_open_fds:
        type: above
        thresholds:
          warning: 1000
          critical: 5000

      quickpizza_server_ws_connections_active:
        type: above
        thresholds:
          warning: 100
          critical: 500
---
apiVersion: v1
kind: Service
metadata:
  name: quickpizza
  namespace: quick-pizza
  labels:
    app: quickpizza
spec:
  type: ClusterIP
  selector:
    app: quickpizza
  ports:
    - name: http
      port: 3333
      targetPort: http
