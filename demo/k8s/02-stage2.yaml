apiVersion: v1
kind: Namespace
metadata:
  name: howru-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: howru-api
  namespace: howru-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: howru-api
  template:
    metadata:
      labels:
        app: howru-api
    spec:
      containers:
        - name: howru-api
          image: howruapi:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: almond-data
              mountPath: /opt/almond/data
      volumes:
        - name: almond-data
          hostPath:
            path: /var/lib/almond-demo/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: howru-api
  namespace: howru-proxy
spec:
  selector:
    app: howru-api
  ports:
    - name: http
      port: 80
      targetPort: http
