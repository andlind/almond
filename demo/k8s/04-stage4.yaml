apiVersion: v1
kind: Namespace
metadata:
  name: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      initContainers:
        - name: prepare-data-directories
          image: my-prometheus-k8s:local
          imagePullPolicy: Never
          command: ["/usr/bin/chmod"]
          args: ["0777", "/opt/almond/data", "/prometheus"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: almond-data
              mountPath: /opt/almond/data
            - name: prometheus-data
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: my-prometheus-k8s:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: almond-data
              mountPath: /opt/almond/data
            - name: prometheus-data
              mountPath: /prometheus
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
      volumes:
        - name: almond-data
          hostPath:
            path: /var/lib/almond-demo/data
            type: DirectoryOrCreate
        - name: prometheus-data
          hostPath:
            path: /var/lib/almond-demo/prometheus
            type: DirectoryOrCreate
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
